[pytest]
; backend/ không phải package (main.py dùng import phẳng "from llm_providers import ...",
; khớp cách chạy thật: uvicorn main:app --app-dir backend) → thêm vào sys.path qua pythonpath
; thay vì tạo __init__.py giả (sẽ đổi import style hiện có).
pythonpath = backend
asyncio_mode = auto
testpaths = backend/tests
