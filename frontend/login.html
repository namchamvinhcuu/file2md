<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập — file2md</title>
<style>
  :root {
    color-scheme: light dark;
    /* Primitive tokens */
    --indigo-600: #4f46e5;
    --indigo-700: #4338ca;
    --gray-50: #f7f7f8;
    --white: #ffffff;
    --gray-200: #e2e2e6;
    --gray-500: #6b6b73;
    --gray-900: #1b1b1f;
    --red-600: #dc2626;
    --gray-950: #16161a;
    --gray-850: #1f1f24;
    --gray-700: #34343b;
    --gray-100: #eaeaee;
    --gray-400: #9a9aa2;

    /* Semantic tokens */
    --bg: var(--gray-50);
    --panel: var(--white);
    --border: var(--gray-200);
    --text: var(--gray-900);
    --muted: var(--gray-500);
    --accent: var(--indigo-600);
    --accent-hover: var(--indigo-700);
    --danger: var(--red-600);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--gray-950);
      --panel: var(--gray-850);
      --border: var(--gray-700);
      --text: var(--gray-100);
      --muted: var(--gray-400);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 360px;
    margin: 1.5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 1.75rem;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .field {
    margin-bottom: 1.1rem;
  }
  input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button.primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.65rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    margin-top: 0.25rem;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  #error {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 0.9rem;
    min-height: 1.1em;
  }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>file2md</h1>
    <p class="subtitle">Đăng nhập để tiếp tục.</p>

    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>

    <button class="primary" id="submit-btn" type="submit">Đăng nhập</button>
    <div id="error"></div>
  </form>

<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    submitBtn.disabled = true;

    const body = new FormData(form);
    try {
      const res = await fetch("/api/login", { method: "POST", body });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || "Đăng nhập thất bại.");
      }
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = err.message;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
